<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Agriturismo Cascina Ronchi · Palazzago (BG)</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f6f3a">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <noscript><style>#splash{display:none}</style></noscript>
  <style>
    /* Critical CSS: colours mirror the design tokens in src/styles/_tokens.scss (cream-50, meadow-600/900, cream-200). */
    #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;background:#fbf7ee;color:#24361a;opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s .4s;animation:splash-failsafe .4s ease 4s forwards}
    #splash.is-leaving{opacity:0;visibility:hidden}
    #splash svg{width:min(14rem,60vw);height:auto}
    #splash .name{margin:0;font:600 clamp(1.5rem,1.2rem + 1.5vw,2.25rem)/1.1 Fraunces,Georgia,'Times New Roman',serif;letter-spacing:.01em}
    #splash .bar{width:min(9rem,40vw);height:3px;overflow:hidden;border-radius:3px;background:#e8dcbf}
    #splash .bar::after{content:"";display:block;width:40%;height:100%;border-radius:3px;background:#4f6f3a;animation:splash-bar 1.4s ease-in-out infinite}
    #splash .head{transform-box:view-box;transform-origin:76px 36px;animation:splash-nibble 2.6s ease-in-out infinite}
    #splash .tail{transform-box:fill-box;transform-origin:100% 100%;animation:splash-tail 1.3s ease-in-out infinite}
    @keyframes splash-nibble{0%,18%,72%,100%{transform:rotate(0)}32%,56%{transform:rotate(26deg)}40%{transform:rotate(19deg)}48%{transform:rotate(27deg)}}
    @keyframes splash-tail{50%{transform:rotate(-18deg)}}
    @keyframes splash-bar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
    @keyframes splash-failsafe{to{opacity:0;visibility:hidden}}
    @media (prefers-reduced-motion:reduce){
      #splash{transition-duration:.15s,0s;transition-delay:0s,.15s}
      #splash .head,#splash .tail,#splash .bar::after{animation:none}
      #splash .bar::after{width:100%}
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true" data-nosnippet>
    <svg viewBox="0 0 120 80" fill="none">
      <path d="M8 72h104" stroke="#5f8247" stroke-width="2" stroke-linecap="round"/>
      <path d="M86 72c0-6-2-9-4-11M90 72c0-7 1-10 3-12M94 72c0-5 2-8 5-9M100 72c0-4 2-6 4-7M14 72c0-5-1-8-3-9M20 72c0-6 1-9 3-10" stroke="#5f8247" stroke-width="2" stroke-linecap="round"/>
      <path class="tail" d="M27 38l-9-9" stroke="#3d4649" stroke-width="4" stroke-linecap="round"/>
      <g fill="#3d4649">
        <rect x="34" y="50" width="5" height="21" rx="2"/>
        <rect x="42" y="50" width="5" height="21" rx="2"/>
        <rect x="62" y="50" width="5" height="21" rx="2"/>
        <rect x="70" y="50" width="5" height="21" rx="2"/>
        <ellipse cx="52" cy="42" rx="26" ry="14"/>
        <g class="head">
          <path d="M68 30l14-5 9 13-14 9z"/>
          <ellipse cx="94" cy="36" rx="10" ry="7" transform="rotate(20 94 36)"/>
          <ellipse cx="103" cy="41" rx="4.5" ry="3.5"/>
          <path d="M100 45l-1 8 5-7z"/>
          <ellipse cx="88" cy="32" rx="5" ry="2.5" transform="rotate(-30 88 32)"/>
          <path d="M90 29c-4-11 0-16 6-17" fill="none" stroke="#98431f" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="96" cy="34" r="1.3" fill="#fbf7ee"/>
        </g>
      </g>
    </svg>
    <p class="name">Cascina Ronchi</p>
    <div class="bar"></div>
  </div>
  <script>
    // Keep keyboard focus out of the page while the splash covers it. SplashService lifts this;
    // the timeout is the failsafe if the bundle never loads. Without JS the page is never inert.
    (function () {
      var root = document.querySelector('app-root');
      root.inert = true;
      setTimeout(function () { root.inert = false; }, 4000);
    })();
  </script>
  <app-root></app-root>
</body>
</html>
